server {
    listen 80;
    listen [::]:80;
    server_name math.astroswarm.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name math.astroswarm.cn;

    ssl_certificate     /etc/letsencrypt/live/math.astroswarm.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/math.astroswarm.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /opt/shuxing-lab/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
